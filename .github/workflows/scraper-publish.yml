name: Publish Scraper

on:
  push:
    branches:
      - main
    paths:
      - "packages/scraper/**"
      - ".changeset/**"

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - name: Build and Tag Release
        id: changesets
        uses: changesets/action@v1
        with:
          publish: bun run release:scraper
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Version and Tag Name
        if: steps.changesets.outputs.published == 'true'
        id: tag
        run: |
          PKG_NAME=$(bun -e "console.log(JSON.parse(await Bun.file('packages/scraper/package.json').text()).name)")
          VERSION=$(bun -e "console.log(JSON.parse(await Bun.file('packages/scraper/package.json').text()).version)")
          TAG_NAME="${PKG_NAME}@${VERSION}"
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Package: $PKG_NAME, Version: $VERSION, Tag: $TAG_NAME"

      - name: Create GitHub Release
        if: steps.changesets.outputs.published == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Scraper v${{ steps.tag.outputs.version }}
          files: |
            packages/scraper/out/ig-scraper-linux
            packages/scraper/out/ig-scraper-macos-x64
            packages/scraper/out/ig-scraper-macos-arm64
            packages/scraper/out/ig-scraper-windows.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
