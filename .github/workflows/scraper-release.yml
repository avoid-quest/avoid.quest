name: Release Scraper

on:
  push:
    branches:
      - main
    paths:
      - "packages/scraper/**"
      - ".changeset/**"

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for relevant changes
        id: check_changes
        run: |
          # For push events, compare with previous commit
          BASE_SHA="${{ github.event.before }}"
          HEAD_SHA="${{ github.sha }}"

          # If BASE_SHA is empty or invalid, default to HEAD~1
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="HEAD~1"
          fi

          CHANGED_FILES=$(git diff --name-only $BASE_SHA $HEAD_SHA 2>/dev/null || echo "")

          SCRAPER_CHANGED=$(echo "$CHANGED_FILES" | grep -E "^packages/scraper/" || echo "")
          CHANGESET_CHANGED=$(echo "$CHANGED_FILES" | grep -E "^\.changeset/" || echo "")

          if [ -z "$SCRAPER_CHANGED" ] && [ -z "$CHANGESET_CHANGED" ]; then
            echo "No relevant changes found in packages/scraper/ or .changeset/"
            echo "should_run=false" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "Relevant changes detected"
            echo "should_run=true" >> $GITHUB_OUTPUT
          fi

      - uses: oven-sh/setup-bun@v2
        if: steps.check_changes.outputs.should_run == 'true'
        with:
          bun-version: latest

      - run: bun install
        if: steps.check_changes.outputs.should_run == 'true'

      - name: Create Release Pull Request or Build and Release
        if: steps.check_changes.outputs.should_run == 'true'
        id: changesets
        uses: changesets/action@v1
        with:
          version: bun run version-packages
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if Version Changed
        if: steps.check_changes.outputs.should_run == 'true' && steps.changesets.outputs.hasChangesets == 'false'
        id: version_check
        run: |
          set -e
          CURRENT_VERSION=$(bun -e "console.log(JSON.parse(await Bun.file('packages/scraper/package.json').text()).version)")

          PREVIOUS_VERSION=""
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            if git show HEAD~1:packages/scraper/package.json > /tmp/prev-package.json 2>/dev/null; then
              PREVIOUS_VERSION=$(bun -e "console.log(JSON.parse(await Bun.file('/tmp/prev-package.json').text()).version)")
            fi
          fi

          if [ -z "$PREVIOUS_VERSION" ] || [ "$CURRENT_VERSION" != "$PREVIOUS_VERSION" ]; then
            echo "version_changed=true" >> $GITHUB_OUTPUT
            echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          else
            echo "version_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Git Tags
        if: steps.check_changes.outputs.should_run == 'true' && steps.changesets.outputs.hasChangesets == 'false' && steps.version_check.outputs.version_changed == 'true'
        run: |
          # Changesets reads from package.json and creates tags based on current version
          bun changeset tag

      - name: Get Version and Create Tag Name
        if: steps.check_changes.outputs.should_run == 'true' && steps.changesets.outputs.hasChangesets == 'false' && steps.version_check.outputs.version_changed == 'true'
        id: tag
        run: |
          # Read from package.json as single source of truth
          PKG_NAME=$(bun -e "console.log(JSON.parse(await Bun.file('packages/scraper/package.json').text()).name)")
          VERSION="${{ steps.version_check.outputs.version }}"
          TAG_NAME="${PKG_NAME}@${VERSION}"
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "Package: $PKG_NAME, Version: $VERSION, Tag: $TAG_NAME"

      - name: Build All Platforms
        if: steps.check_changes.outputs.should_run == 'true' && steps.changesets.outputs.hasChangesets == 'false' && steps.version_check.outputs.version_changed == 'true'
        working-directory: packages/scraper
        run: bun run build:all

      - name: Push Tags
        if: steps.check_changes.outputs.should_run == 'true' && steps.changesets.outputs.hasChangesets == 'false' && steps.version_check.outputs.version_changed == 'true'
        run: git push --follow-tags

      - uses: softprops/action-gh-release@v2
        if: steps.check_changes.outputs.should_run == 'true' && steps.changesets.outputs.hasChangesets == 'false' && steps.version_check.outputs.version_changed == 'true'
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Scraper v${{ steps.version_check.outputs.version }}
          files: |
            packages/scraper/out/ig-scraper-linux
            packages/scraper/out/ig-scraper-macos-x64
            packages/scraper/out/ig-scraper-macos-arm64
            packages/scraper/out/ig-scraper-windows.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
