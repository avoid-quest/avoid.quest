services:
  bot:
    build:
      context: ../..
      dockerfile: apps/discord-bot/Dockerfile
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
      - DISCORD_GUILD_ID=${DISCORD_GUILD_ID:-}
      - INVIDIOUS_INSTANCE_URL=${INVIDIOUS_INSTANCE_URL:-https://yt.avoid.quest}
      - INVIDIOUS_AUTH=${INVIDIOUS_AUTH:-}
    network_mode: host
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
