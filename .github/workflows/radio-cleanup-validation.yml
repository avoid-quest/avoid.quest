name: Radio cleanup validation

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/radio/**"
      - "packages/**"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "turbo.json"
      - ".github/workflows/radio-cleanup-validation.yml"

permissions:
  contents: read

concurrency:
  group: radio-cleanup-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Real browser integration tests
        run: bun run --filter @avoid.quest/radio test:e2e
      - name: Upload Playwright diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: radio-playwright-${{ github.run_attempt }}
          path: |
            apps/radio/playwright-report/
            apps/radio/test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Report radio bundle sizes
        run: |
          find apps/radio/dist -type f -printf "%s %p\n" 2>/dev/null |
            sort -nr |
            head -100
