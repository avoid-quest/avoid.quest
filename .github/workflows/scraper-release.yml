name: Release Scraper

on:
  push:
    branches:
      - main
    paths:
      - "packages/scraper/**"
      - ".changeset/**"

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    name: Version Packages
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - uses: changesets/action@v1
        with:
          version: bun changeset version
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Build and Release
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - name: Check if Version Changed
        id: version_check
        run: |
          set -e
          CURRENT_VERSION=$(bun -e "console.log(JSON.parse(await Bun.file('packages/scraper/package.json').text()).version)")

          PREVIOUS_VERSION=""
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            if git show HEAD~1:packages/scraper/package.json > /tmp/prev-package.json 2>/dev/null; then
              PREVIOUS_VERSION=$(bun -e "console.log(JSON.parse(await Bun.file('/tmp/prev-package.json').text()).version)")
            fi
          fi

          if [ -z "$PREVIOUS_VERSION" ] || [ "$CURRENT_VERSION" != "$PREVIOUS_VERSION" ]; then
            echo "version_changed=true" >> $GITHUB_OUTPUT
            echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          else
            echo "version_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Git Tags
        if: steps.version_check.outputs.version_changed == 'true'
        run: |
          # Changesets reads from package.json and creates tags based on current version
          bun changeset tag

      - name: Get Version and Create Tag Name
        id: tag
        if: steps.version_check.outputs.version_changed == 'true'
        run: |
          # Read from package.json as single source of truth
          PKG_NAME=$(bun -e "console.log(JSON.parse(await Bun.file('packages/scraper/package.json').text()).name)")
          VERSION="${{ steps.version_check.outputs.version }}"
          TAG_NAME="${PKG_NAME}@${VERSION}"
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "Package: $PKG_NAME, Version: $VERSION, Tag: $TAG_NAME"

      - name: Build All Platforms
        if: steps.version_check.outputs.version_changed == 'true'
        working-directory: packages/scraper
        run: bun run build:all

      - name: Push Tags
        if: steps.version_check.outputs.version_changed == 'true'
        run: git push --follow-tags

      - uses: softprops/action-gh-release@v2
        if: steps.version_check.outputs.version_changed == 'true'
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Scraper v${{ steps.version_check.outputs.version }}
          files: |
            packages/scraper/out/ig-scraper-linux
            packages/scraper/out/ig-scraper-macos-x64
            packages/scraper/out/ig-scraper-macos-arm64
            packages/scraper/out/ig-scraper-windows.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
