name: Release Scraper

on:
  push:
    branches:
      - main
    paths:
      - "packages/scraper/**"
      - ".changeset/**"

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    name: Version Packages
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - uses: changesets/action@v1
        with:
          version: bun changeset version
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Build and Release
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' &&
      contains(github.event.head_commit.message, 'chore: version packages')
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - name: Get Version
        id: version
        run: |
          VERSION=$(bun -e "console.log(JSON.parse(await Bun.file('packages/scraper/package.json').text()).version)")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build All Platforms
        working-directory: packages/scraper
        run: bun run build:all

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: scraper-v${{ steps.version.outputs.version }}
          name: Scraper v${{ steps.version.outputs.version }}
          files: |
            packages/scraper/scraper-linux
            packages/scraper/scraper-macos-x64
            packages/scraper/scraper-macos-arm64
            packages/scraper/scraper-windows.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
